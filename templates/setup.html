<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>OptiGuide – Data Setup</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { margin:0; padding:0; background:#020617; color:#e5e7eb;
               font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        .wrap { min-height: 100vh; display:flex; align-items:center; justify-content:center; }
        .card { width:100%; max-width:720px; padding:32px 28px; border-radius:18px;
                background: radial-gradient(circle at top, #020617 0, #020617 70%);
                border:1px solid #1f2937; box-shadow:0 18px 60px rgba(0,0,0,0.65); }
        h1 { font-size:1.4rem; margin-bottom:10px; }
        p { font-size:0.95rem; line-height:1.6; color:#9ca3af; }
        .field { margin-top:22px; margin-bottom:18px; }
        label { font-size:0.9rem; display:block; margin-bottom:8px; color:#d1d5db; }
        input[type="file"] {
            width:100%; padding:10px; border-radius:10px; border:1px solid #374151;
            background:#020617; color:#e5e7eb; font-size:0.9rem;
        }
        .actions { display:flex; gap:10px; margin-top:18px; }
        .primary { padding:9px 20px; border-radius:999px; border:none;
                   background: linear-gradient(to right, #2563eb, #1d4ed8);
                   color:#f9fafb; font-size:0.95rem; font-weight:500; cursor:pointer; }
        .primary:hover { background: linear-gradient(to right, #1d4ed8, #1d4ed8); }
        .secondary { padding:9px 20px; border-radius:999px; border:1px solid #4b5563;
                     background: transparent; color:#e5e7eb; font-size:0.9rem; cursor:pointer; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="card">
        <h1>Hello, I am your OptiGuide assistant.</h1>
        <p>
            Before we start, please provide your data file (for example <code>data.csv</code>)
            or confirm the default dataset. After that, continue to the chatbot.
        </p>

        <form method="post" enctype="multipart/form-data">
            <div class="field">
                <label for="datafile">Select data file (.csv)</label>
                <input type="file" id="datafile" name="datafile" accept=".csv">
            </div>

            <div class="actions">
                <button type="submit" class="primary">Use this data and go to Chat</button>
                <a href="{{ url_for('chat') }}" class="secondary">Skip upload, use default data</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
