            Your AI-powered supply chain intelligence assistant.<br>
            Upload a dataset, then ask about demand, inventory, cost, or what-if scenarios.
        </div>

            <button class="modal-primary-btn" id="get-started-btn">Get started</button>
        </div>

<script>
const chatArea = document.getElementById('chat-area');
const queryInput = document.getElementById('query');
const sendBtn = document.getElementById('send-btn');
const uploadForm = document.getElementById('upload-form');
const uploadMsg = document.getElementById('upload-msg');
const filePreview = document.getElementById('file-preview');
const themeToggle = document.getElementById('theme-toggle');
const themeIcon = document.getElementById('theme-icon');
const themeLabel = document.getElementById('theme-label');
const introModal = document.getElementById('intro-modal');
const getStartedBtn = document.getElementById('get-started-btn');
const mainContainer = document.getElementById('main-container');
const bgOrbs = document.querySelector('.bg-orbs');

let typingRow = null;

/* ------------------------------------------------------------
   LOCAL STORAGE HELPERS
------------------------------------------------------------ */
const STORAGE_KEY = 'optiguide_chat_history';
const THEME_KEY = 'optiguide_theme';

function saveHistory(messages) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
}

function loadHistory() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
    } catch(e) {
        return [];
    }
}

/* Message structure: {role: 'user'|'bot', text: '...'} */
let history = loadHistory();

/* ------------------------------------------------------------
   RENDER MESSAGES FROM HISTORY ON LOAD
------------------------------------------------------------ */
function escapeHtml(str) {
    return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
}

function highlightBotText(text) {
    let safe = escapeHtml(text);

    // Bullet-like lines
    safe = safe.replace(/(^|\\n)[\\-\\]\\s+(.)/g, function(match, p1, p2){
        return p1 + '<span class="hl-bullet">' + p2 + '</span>';
    });

    // Numbers
    safe = safe.replace(/(\\b\\d+(?:\\.\\d+)?\\b)/g, '<span class="hl-number">$1</span>');

    return safe;
}

function appendMessage(text, role){
    const row = document.createElement('div');
    row.className = 'chat-row ' + (role === 'user' ? 'user-row' : 'bot-row');

    const avatar = document.createElement('div');
    avatar.className = 'avatar ' + (role === 'user' ? 'user' : 'bot');
    avatar.textContent = role === 'user' ? '🙂' : '🤖';

    const bubble = document.createElement('div');
    bubble.className = 'msg ' + role;

    if (role === 'bot') {
        bubble.innerHTML = highlightBotText(text);
    } else {
        bubble.textContent = text;
    }

    if (role === 'user') {
        row.appendChild(bubble);
        row.appendChild(avatar);
    } else {
        row.appendChild(avatar);
        row.appendChild(bubble);
    }

    chatArea.appendChild(row);
    chatArea.scrollTop = chatArea.scrollHeight;
}

function renderHistory() {
    chatArea.innerHTML = '';
    history.forEach(msg => appendMessage(msg.text, msg.role));
}

/* ------------------------------------------------------------
   TYPING INDICATOR
------------------------------------------------------------ */
function showTyping() {
    if (typingRow) return;
    typingRow = document.createElement('div');
    typingRow.className = 'chat-row bot-row';

    const avatar = document.createElement('div');
    avatar.className = 'avatar bot';
    avatar.textContent = '🤖';

    const bubble = document.createElement('div');
    bubble.className = 'msg bot typing';

    const label = document.createElement('span');
    label.textContent = 'OptiGuide is thinking ';

    const dots = document.createElement('span');
    dots.className = 'typing-dots';
    dots.innerHTML = '<span></span><span></span><span></span>';

    bubble.appendChild(label);
    bubble.appendChild(dots);

    typingRow.appendChild(avatar);
    typingRow.appendChild(bubble);

    chatArea.appendChild(typingRow);
    chatArea.scrollTop = chatArea.scrollHeight;
}

function hideTyping() {
    if (typingRow) {
        typingRow.remove();
        typingRow = null;
    }
}

/* ------------------------------------------------------------
   SEND QUERY TO SERVER
------------------------------------------------------------ */
async function sendQuery(){
    const q = queryInput.value.trim();
    if (!q) return;

    appendMessage(q, 'user');
    history.push({role: 'user', text: q});
    saveHistory(history);

    queryInput.value = '';
    queryInput.focus();

    showTyping();
    sendBtn.disabled = true;

    try {
        const resp = await fetch('/query', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({query: q})
        });
        const data = await resp.json();
        const botText = data.response || '(no response)';

        hideTyping();
        appendMessage(botText, 'bot');
        history.push({role: 'bot', text: botText});
        saveHistory(history);
    } catch (err) {
        hideTyping();
        const errMsg = 'Error contacting server: ' + err;
        appendMessage(errMsg, 'bot');
        history.push({role: 'bot', text: errMsg});
        saveHistory(history);
    } finally {
        sendBtn.disabled = false;
    }
}

/* Enter key sends message */
queryInput.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendQuery();
    }
});

/* ------------------------------------------------------------
   UPLOAD CSV
------------------------------------------------------------ */
uploadForm.onsubmit = async function(e){
    e.preventDefault();

    const file = document.getElementById('csvfile').files[0];
    if (!file) {
        alert('Select a CSV file first');
        return;
    }

    filePreview.textContent = 'Selected: ' + file.name + ' (' + Math.round(file.size/1024) + ' KB)';

    const fd = new FormData();
    fd.append('file', file);

    uploadMsg.textContent = 'Uploading...';

    try {
        const resp = await fetch('/upload', {
            method:'POST',
            body: fd
        });
        const j = await resp.json();
        uploadMsg.textContent = j.message || 'Upload complete.';
    } catch (err) {
        uploadMsg.textContent = 'Upload failed: ' + err;
    }
};

/* ------------------------------------------------------------
   THEME TOGGLE (LIGHT / DARK)
------------------------------------------------------------ */
function applyTheme(theme) {
    if (theme === 'light') {
        document.body.classList.add('light');
        themeIcon.textContent = '☀';
        themeLabel.textContent = 'Light';
    } else {
        document.body.classList.remove('light');
        themeIcon.textContent = '🌙';
        themeLabel.textContent = 'Dark';
    }
}

function loadTheme() {
    const stored = localStorage.getItem(THEME_KEY);
    return stored === 'light' ? 'light' : 'dark';
}

let currentTheme = loadTheme();
applyTheme(currentTheme);

themeToggle.addEventListener('click', () => {
    currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
    localStorage.setItem(THEME_KEY, currentTheme);
    applyTheme(currentTheme);
});

/* ------------------------------------------------------------
   WELCOME MODAL BEHAVIOR + CHAT BACKGROUND SWITCH
------------------------------------------------------------ */
function openIntroModal() {
    introModal.classList.add('show');
}
function closeIntroModal() {
    introModal.classList.remove('show');
    // Switch background: fade out orbs, enable gradient waves
    if (bgOrbs) bgOrbs.classList.add('hide');
    if (mainContainer) mainContainer.classList.add('chat-waves');
    queryInput.focus();
}

getStartedBtn.addEventListener('click', closeIntroModal);

window.addEventListener('load', () => {
    openIntroModal();
    renderHistory();
});

</script>

</body>
</html>
